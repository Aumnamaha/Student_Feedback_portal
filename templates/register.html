{% extends "base.html" %}
{% block title %}Register — Student Feedback{% endblock %}
{% block content %}
<div class="auth-form">
    <h1>Register</h1>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="roll_number">Roll Number <span class="optional">(optional)</span></label>
            <input type="text" id="roll_number" name="roll_number">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" minlength="6" required>
        </div>
        <button type="submit" class="btn-primary">Register</button>
    </form>
    <p class="form-footer">Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a></p>
</div>
{% endblock %}
